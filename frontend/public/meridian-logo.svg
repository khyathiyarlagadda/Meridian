<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="meridianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1810" />
      <stop offset="45%" stop-color="#8C4A27" />
      <stop offset="100%" stop-color="#E28E4D" />
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28E4D" />
      <stop offset="100%" stop-color="#F7C59F" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Background for High Contrast -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#FDFBF7" stroke="#E5DDD0" stroke-width="3" />
  
  <!-- Stylized Compass / Meridian M Emblem -->
  <g transform="translate(15, 15)">
    <!-- Primary M Arch Left -->
    <path d="M 15,55 L 15,22 C 15,15 25,12 35,24 L 35,55" fill="none" stroke="url(#meridianGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Primary M Arch Right -->
    <path d="M 35,55 L 35,24 C 45,12 55,15 55,22 L 55,55" fill="none" stroke="url(#meridianGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Meridian North-Star Diamond Accent -->
    <polygon points="35,5 39,12 35,19 31,12" fill="url(#markGrad)" />
  </g>
</svg>
